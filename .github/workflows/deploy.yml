name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dharshini-creations/package-lock.json

      - name: Install dependencies 🔧
        run: npm ci --legacy-peer-deps
        working-directory: dharshini-creations

      - name: Build 🏗️
        env:
          # Store these in GitHub → Settings → Secrets and variables → Actions
          # Add: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
        working-directory: dharshini-creations

      - name: Create 404.html for SPA Routing 📄
        run: cp dharshini-creations/dist/index.html dharshini-creations/dist/404.html

      - name: Upload Pages Artifact 📤
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./dharshini-creations/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
