name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dharshini-creations/package-lock.json

      - name: Install dependencies 🔧
        run: npm ci --legacy-peer-deps
        working-directory: dharshini-creations

      - name: Build 🏗️
        env:
          # Public Supabase config — anon key is safe in frontend builds.
          # Override via GitHub Secrets if you rotate the project keys.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pzdulbzdolnrtyxnuxkp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6ZHVsYnpkb2xucnR5eG51eGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjEyMjQsImV4cCI6MjA5NTQzNzIyNH0.PtllPqeRqTBjB7ktGiQWMhWmhUcQqZmDTH50y9Lv4KM' }}
        run: npm run build
        working-directory: dharshini-creations

      - name: Create 404.html for SPA Routing 📄
        run: cp dharshini-creations/dist/index.html dharshini-creations/dist/404.html

      - name: Upload Pages Artifact 📤
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./dharshini-creations/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
